{% extends "base.html" %}
{% load static %}

{% block navigation %}
    {% include "partials/app-nav.html" %}
{% endblock %}

{% block title %}Messenger{% endblock %}

{% block content %}

{% csrf_token %}
<input type="hidden" id="csrfToken" value="{{ csrf_token }}">


<div class="row" style="height:75vh;">
    
    <!-- LEFT PANE: CONTACTS -->
    <div class="col-3 border-end overflow-auto">
        <h5 class="mt-2">Contacts</h5>
        <ul class="list-group">
            {% for c in contacts %}
            <li class="list-group-item contact-item 
                {% if c.has_unread %}list-group-item-warning{% endif %}"
                data-user-id="{{ c.user.id }}">

                <img src="{{ c.user.profile.avatar.url|default:'/static/img/default-avatar.jpg' }}"
                    class="rounded-circle me-2"
                    style="width:32px;height:32px;object-fit:cover;">

                {{ c.user.username }}


            </li>
            {% endfor %}
        </ul>
    </div>

    <!-- RIGHT PANE: CHAT -->
    <div class="col-9 chat-container">
    <div id="chatWindow" class="p-3 bg-light"></div>

    <div class="input-group mt-2">
        <input id="chatInput" type="text" class="form-control" placeholder="Type a message...">
        <button id="sendBtn" class="btn btn-primary">Send</button>
    </div>

</div>

<script>
    const CURRENT_USERNAME = "{{ request.user.username }}";
</script>


<script src="{% static 'js/messenger.js' %}"></script>

<style>
    .chat-container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 150px); /* subtract nav + header */
    }

    #chatWindow {
        flex: 1;
        overflow-y: auto;
    }
</style>
{% endblock %}
