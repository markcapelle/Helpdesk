{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

<form method="POST">
    {% csrf_token %}

    {{ user_form.as_p }}
    {% if profile_form %}
        {{ profile_form.as_p }}
    {% endif %}

    <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
</form>

<br>
<form action="{% url 'homepage' %}" method="GET">
    <button type="submit" class="btn btn-secondary">Cancel</button>
</form>

{% endblock %}
