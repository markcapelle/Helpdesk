{% extends "base.html" %}

{% block navigation %}
    {% include "partials/app-nav.html" %}
{% endblock %}

{% block title %}Tickets{% endblock %}

{% block content %}
<h1 class="mb-4">Tickets</h1>

<!-- New Ticket Button -->
<div class="mb-3">
    <a href="{% url 'new_ticket' %}" class="btn btn-success">+ New Ticket</a>

</div>

<!-- Filter Dropdown -->
<form method="GET" class="mb-4">
    <label class="form-label">Filter by Status</label>
    <select name="status" class="form-select" onchange="this.form.submit()">
        <option value="all" {% if status_filter == "all" %}selected{% endif %}>All</option>
        {% for s in statuses %}
            <option value="{{ s.name }}" {% if status_filter == s.name %}selected{% endif %}>
                {{ s.name|title }}
            </option>
        {% endfor %}
    </select>
</form>

<!-- Ticket Table -->
{% include "tickets/ticket_list.html" with tickets=tickets %}



{% endblock %}
